<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Unit Converter</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="min-h-screen bg-slate-100 text-slate-800">

  <!-- Navigation -->
  <header class="bg-teal-800 shadow">

    <nav
      class="mx-auto max-w-3xl px-4 py-4"
      aria-label="Main navigation"
    >

      <div
        class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
      >

        <h1 class="text-xl font-bold text-white">
          Unit Converter
        </h1>

        <!-- Tabs are added with JavaScript -->
        <div
          id="tab-bar"
          role="tablist"
          class="flex flex-wrap gap-1"
        ></div>

      </div>

    </nav>

  </header>


  <!-- Converter panels are added with JavaScript -->
  <main
    id="panels"
    class="mx-auto max-w-3xl px-4 py-8"
  ></main>


  <!-- Footer -->
  <footer class="mx-auto max-w-3xl px-4 pb-8 text-sm text-slate-500">

    <p>
      1 lb = 0.45359237 kg
      &middot;
      1 mi = 1.609344 km
      &middot;
      °F = °C × 9/5 + 32
    </p>

  </footer>


  <!-- JavaScript files -->
  <script src="converters.js"></script>
  <script src="app.js"></script>

</body>

</html>
